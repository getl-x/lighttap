name: Android APK
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install verified Android SDK tools and platform
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          printf 'ANDROID_HOME=%s\nANDROID_USER_HOME=%s\nANDROID_SDK_ROOT=%s\n' \
            "$ANDROID_HOME" "$ANDROID_USER_HOME" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/android-commandlinetools.zip"
          curl --fail --location --retry 3 \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' \
            --output "$archive"
          printf '%s  %s\n' \
            '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583' \
            "$archive" | sha256sum --check --strict
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$ANDROID_USER_HOME"
          unzip -q "$archive" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/22.0"
          sdkmanager="$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager"
          # yes exits with SIGPIPE when sdkmanager finishes; use the SDK exit status.
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > "$RUNNER_TEMP/android-licenses.log"
          set -o pipefail
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint and build APK
        env:
          BUILD_ACCESS_SALT: ${{ secrets.BUILD_ACCESS_SALT }}
          BUILD_ACCESS_DIGEST: ${{ secrets.BUILD_ACCESS_DIGEST }}
        run: bash ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleDebug --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lighttap-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_number }}
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore