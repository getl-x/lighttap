name: Android APK
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build a release APK using repository signing secrets'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_USER_HOME: ${{ runner.temp }}/android-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install verified Android SDK tools and platform
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/android-commandlinetools.zip"
          curl --fail --location --retry 3 \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' \
            --output "$archive"
          printf '%s  %s\n' \
            '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583' \
            "$archive" | sha256sum --check --strict
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$ANDROID_USER_HOME"
          unzip -q "$archive" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/22.0"
          sdkmanager="$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager"
          # yes exits with SIGPIPE when sdkmanager finishes; use the SDK exit status.
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > "$RUNNER_TEMP/android-licenses.log"
          set -o pipefail
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint and build debug APK
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - name: Restore personal signing key
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing signing secret: $name"; exit 1; fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lighttap-release.jks"
      - name: Build signed release APK
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/lighttap-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --console=plain
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: lighttap-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/lighttap-release.jks"